<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Why no <title>?
    Popups don't show a title bar, so a <title> tag is unnecessary here.
    But we still use lang="en" and charset for good practice.
  -->
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header section with the extension name -->
  <header class="header">
    <h1 class="header__title">AutoCollapse</h1>
    <p class="header__subtitle">Tab Group Manager</p>
  </header>

  <!-- Main content area — group info and action buttons -->
  <main class="content">
    <!-- Live count of tab groups -->
    <p class="content__group-count" id="group-count">
      Loading...
    </p>

    <!-- Action buttons -->
    <div class="content__actions">
      <button class="btn btn--primary" id="btn-collapse-all">
        Collapse All
      </button>
      <button class="btn btn--secondary" id="btn-expand-all">
        Expand All
      </button>
    </div>

    <!-- Status message (shows result of last action) -->
    <p class="content__action-status" id="action-status"></p>
  </main>

  <!-- Footer with version info -->
  <footer class="footer">
    <span class="footer__version" id="version-text"></span>
  </footer>

  <!--
    IMPORTANT: No inline scripts allowed in Chrome Extensions!
    ❌ <script>console.log('hello')</script>     — CSP blocks this
    ❌ <button onclick="doStuff()">              — CSP blocks this too
    ✅ <script src="popup.js"></script>           — External file, this works
  -->
  <script src="popup.js"></script>
</body>
</html>
